server:
  port: 9003

spring:
  application:
    name: ai-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

ai:
  llm:
    api-key: ${AI_API_KEY:}
    base-url: https://api.openai.com/v1
    model: gpt-4o
  asr:
    provider: iflytek
    app-id: ${ASR_APP_ID:}
    api-key: ${ASR_API_KEY:}
