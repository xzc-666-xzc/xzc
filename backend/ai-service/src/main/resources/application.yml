server:
  port: 9003

spring:
  application:
    name: ai-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
ai:
  llm:
    # DeepSeek API Key（从环境变量读取）
    api-key: ${DEEPSEEK_API_KEY:}
    # DeepSeek API 地址（兼容 OpenAI 协议）
    base-url: https://api.deepseek.com/v1
    # DeepSeek 模型：deepseek-chat / deepseek-coder
    model: deepseek-chat
    # 温度参数（0-2），控制回答随机性
    temperature: 0.7
    # 最大输出令牌数
    max-tokens: 2048
  asr:
    provider: iflytek
    app-id: ${ASR_APP_ID:}
    api-key: ${ASR_API_KEY:}
