# ============================================================
# API 网关配置
# ============================================================
server:
  port: 8080

spring:
  application:
    name: gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 用户服务
        - id: user-service
          uri: http://user-service:9001
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        # 面试服务（岗位+面试）
        - id: interview-service
          uri: http://interview-service:9002
          predicates:
            - Path=/api/interviews/**,/api/positions/**
          filters:
            - StripPrefix=1
        # AI服务
        - id: ai-service
          uri: http://ai-service:9003
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1
        # 报告服务
        - id: report-service
          uri: http://report-service:9004
          predicates:
            - Path=/api/reports/**,/api/wrong-book/**
          filters:
            - StripPrefix=1
        # 工单 + 通知 + 文件访问 → user-service
        - id: user-service-workorder
          uri: http://user-service:9001
          predicates:
            - Path=/api/work-orders/**,/api/notifications/**,/api/files/**
          filters:
            - StripPrefix=1
      # CORS跨域配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
